<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق الإنجليزية — English StudyMate</title>
<meta name="theme-color" content="#2F8FBF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English StudyMate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0E1017; --lift1:#1A1F33; --lift2:#151A28;
  --ink:#D6D9E6; --ink-soft:#9195AB; --ink-faint:#666B82;

  --glass:linear-gradient(158deg, rgba(255,255,255,.062), rgba(255,255,255,.022));
  --glass-line:rgba(255,255,255,.085);
  --glass-shadow:0 18px 46px rgba(0,0,0,.42);
  --edge:rgba(255,255,255,.18);

  --flat:rgba(255,255,255,.032);
  --flat-line:rgba(255,255,255,.062);
  --line:rgba(255,255,255,.075);
  --solid:#1B2030;

  --ok:#2DD4BF; --ok-soft:rgba(45,212,191,.14);
  --bad:#FF7A7A; --bad-soft:rgba(255,122,122,.14);

  --c-letters:#FFB020; --c-letters-tint:rgba(255,176,32,.18);
  --c-tenses:#33B5FF;  --c-tenses-tint:rgba(51,181,255,.18);
  --c-translate:#C57BFF; --c-translate-tint:rgba(197,123,255,.18);
  --c-home:#2FE0B0; --c-home-tint:rgba(47,224,176,.18);
  --c-free:#FF5C8A; --c-free-tint:rgba(255,92,138,.18);
  --c-report:#2FE0B0; --c-report-tint:rgba(47,224,176,.18);

  --glow:var(--c-home); --glow-tint:var(--c-home-tint);
  --btn-bg:color-mix(in srgb, var(--glow) 18%, transparent);
  --btn-line:color-mix(in srgb, var(--glow) 34%, transparent);
  --btn-ink:color-mix(in srgb, var(--glow) 78%, white);

  --display:"Markazi Text","Space Grotesk",sans-serif;
  --body:"Markazi Text",Tahoma,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
/* الوضع النهاري */
:root[data-theme="light"]{
    --void:#FBF6EC; --lift1:#FFFFFF; --lift2:#F2ECDD;
    --ink:#2B2620; --ink-soft:#6B6255; --ink-faint:#948C7C;
    --glass:linear-gradient(158deg, rgba(255,255,255,.72), rgba(255,255,255,.42));
    --glass-line:rgba(0,0,0,.07);
    --glass-shadow:0 14px 34px rgba(0,0,0,.09);
    --edge:rgba(255,255,255,.95);
    --flat:rgba(43,38,32,.035); --flat-line:rgba(43,38,32,.08); --line:rgba(43,38,32,.09);
    --solid:#FFFFFF;
    --ok:#1F9E7E; --ok-soft:rgba(31,158,126,.12);
    --bad:#C4453A; --bad-soft:rgba(196,69,58,.10);
}
/* الوضع الكحلي المضيء */
:root[data-theme="navy"]{
    --void:#0A1130; --lift1:#161F45; --lift2:#101838;
    --ink:#F0F5FF; --ink-soft:#A9C0F0; --ink-faint:#6E86C4;
    --glass:linear-gradient(158deg, rgba(120,190,255,.18), rgba(120,190,255,.05));
    --glass-line:rgba(140,200,255,.3);
    --glass-shadow:0 18px 46px rgba(20,60,180,.5), 0 0 40px rgba(80,160,255,.12);
    --edge:rgba(180,220,255,.7);
    --flat:rgba(140,190,255,.08); --flat-line:rgba(140,190,255,.16); --line:rgba(140,190,255,.18);
    --solid:#161F45;
    --ok:#3EF0D6; --ok-soft:rgba(62,240,214,.18);
    --bad:#FF7F93; --bad-soft:rgba(255,127,147,.18);
}
/* الوضع الكهرماني */
:root[data-theme="amber"]{
    --void:#1A130A; --lift1:#2C2110; --lift2:#22190D;
    --ink:#FFF6E8; --ink-soft:#E0BE8C; --ink-faint:#A78960;
    --glass:linear-gradient(158deg, rgba(255,200,110,.2), rgba(255,200,110,.06));
    --glass-line:rgba(255,205,120,.32);
    --glass-shadow:0 18px 46px rgba(90,55,10,.55), 0 0 40px rgba(255,180,80,.12);
    --edge:rgba(255,222,160,.75);
    --flat:rgba(255,195,110,.08); --flat-line:rgba(255,195,110,.16); --line:rgba(255,195,110,.18);
    --solid:#2C2110;
    --ok:#A8F065; --ok-soft:rgba(168,240,101,.18);
    --bad:#FF8A6E; --bad-soft:rgba(255,138,110,.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--body); background:var(--void); color:var(--ink);
  font-size:19px; line-height:1.55; height:100%; display:flex; flex-direction:column; overflow:hidden;
}
.en{ font-family:"Space Mono",monospace; direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; }
body[data-lang="en"] .notebook{ text-align:left; }

.appbar{
  flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;
  background:var(--lift2); border-bottom:1px solid var(--line);
}
.appbar h1{ font-family:var(--display); font-size:22px; font-weight:700; line-height:1.1; }
.title-block{ display:flex; flex-direction:column; gap:1px; }
.brand-sub{ font-size:11px; color:var(--ink-faint); letter-spacing:.02em; }
.appbar .dot{ width:11px; height:11px; border-radius:50%; background:var(--glow); box-shadow:0 0 10px var(--glow-tint); transition:background .16s ease, box-shadow .16s ease; }
.appbar .right{ display:flex; align-items:center; gap:10px; }
.theme-toggle, .lang-toggle{
  height:34px; min-width:34px; border-radius:10px; border:1px solid var(--flat-line); background:var(--flat);
  color:var(--ink-soft); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0 9px;
  font-family:var(--display); font-weight:700;
}
.theme-toggle:active, .lang-toggle:active{ transform:scale(.94); }

.content{ flex:1; overflow-y:auto; padding:16px 16px 90px; }
.content .inner{ max-width:640px; margin:0 auto; }

.tabbar{ flex:none; display:flex; background:var(--lift2); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:10px 4px 8px; background:none; border:none; cursor:pointer; color:var(--ink-faint);
  font-family:var(--body); font-size:13.5px; position:relative; transition:color .16s ease;
}
.tab .ic{ font-size:21px; line-height:1; }
.tab.active{ color:var(--tab-color); }
.tab.active::before{ content:""; position:absolute; top:0; left:20%; right:20%; height:3px; border-radius:0 0 4px 4px; background:var(--tab-color); box-shadow:0 0 8px var(--tab-color); }
.tab:focus-visible{ outline:2px solid var(--glow); outline-offset:-2px; }

.subtabs{ display:flex; gap:8px; margin-bottom:16px; }
.subtab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px; border-radius:12px;
  background:var(--flat); border:1px solid var(--flat-line); color:var(--ink-faint); font-size:12.5px; cursor:pointer; }
.subtab .ic{ font-size:18px; }
.subtab.active{ background:var(--sc-tint); border-color:var(--sc); color:var(--sc); font-weight:700; }
.subtab.locked{ opacity:.45; }

.nudge-toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
  background:var(--solid); color:var(--ink); border:1px solid var(--glass-line);
  padding:12px 18px; border-radius:14px; font-size:15px; box-shadow:var(--glass-shadow);
  z-index:50; max-width:88vw; text-align:center;
}
.action-banner{
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  background:var(--solid); border-top:1px solid var(--glass-line); box-shadow:0 -8px 28px rgba(0,0,0,.3);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:12px;
}
.action-banner .txt{ flex:1; font-size:15px; color:var(--ink); }
.action-banner .btn{ width:auto; padding:11px 16px; font-size:14.5px; white-space:nowrap; }
.action-banner .x{ background:none; border:none; color:var(--ink-faint); font-size:20px; cursor:pointer; padding:4px 6px; }
.subbar{ margin-bottom:10px; }
.subbar .t{ font-size:15px; color:var(--ink-soft); }
.step-nav{ display:flex; gap:10px; margin-top:14px; }
.step-nav .btn{ flex:1; }
.step-dots{ display:flex; gap:5px; justify-content:center; margin-top:12px; }
.step-dot{ width:7px; height:7px; border-radius:50%; background:var(--flat-line); }
.step-dot.on{ background:var(--glow); }
.step-dot.past{ background:var(--ok); }
.progress-row{ display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:12px; font-size:13.5px; color:var(--ink-faint); }

.hero{
  background:var(--glass); border:1px solid var(--glass-line); border-radius:26px;
  box-shadow:var(--glass-shadow); padding:22px 20px; position:relative; margin-bottom:18px;
}
.hero::before{ content:''; position:absolute; inset:0 14% auto; height:1px; border-radius:1px;
  background:linear-gradient(90deg,transparent,var(--edge),transparent); }
.hero h2{ font-family:var(--display); font-size:22px; font-weight:700; margin-bottom:6px; }
.hero p{ color:var(--ink-soft); font-size:15.5px; }

.card{ background:var(--flat); border:1px solid var(--flat-line); border-radius:16px; padding:18px; margin-bottom:14px; position:relative; }
.card.glass{ background:var(--glass); border-color:var(--glass-line); box-shadow:var(--glass-shadow); }
.card.glass::before{ content:''; position:absolute; inset:0 14% auto; height:1px; border-radius:1px;
  background:linear-gradient(90deg,transparent,var(--edge),transparent); }
.card h3{ font-family:var(--display); font-size:20px; font-weight:700; margin-bottom:7px; }
.card p{ margin-bottom:7px; }
.eg{ background:var(--glow-tint); border-radius:10px; padding:9px 12px; margin:9px 0; font-size:16.5px; }
.eg .en{ display:block; font-size:15.5px; font-weight:700; color:var(--glow); }

.notebook{
  display:block; width:100%; text-align:right; background:var(--flat); border:1px solid var(--flat-line);
  border-radius:16px; padding:16px 18px; margin-bottom:12px; cursor:pointer;
  border-inline-start:3px solid var(--glow); transition:background .16s ease;
}
.notebook h3{ font-family:var(--display); font-size:20px; font-weight:700; margin-bottom:3px; display:flex; align-items:center; gap:8px;}
.notebook p{ color:var(--ink-soft); font-size:15px; }
.notebook .prog{ margin-top:8px; font-size:13.5px; color:var(--glow); font-weight:700; }
.notebook .rec{ display:inline-block; margin-top:7px; font-size:12px; color:var(--ok); background:var(--ok-soft); padding:3px 9px; border-radius:999px; }

.btn{
  display:block; width:100%; background:var(--btn-bg); border:1px solid var(--btn-line); color:var(--btn-ink);
  padding:17px; border-radius:15px; font-family:var(--display); font-size:16px; font-weight:600;
  transition:background .16s ease, transform .12s ease; cursor:pointer; text-align:center;
}
.btn:hover{ filter:brightness(1.1); }
.btn:active{ transform:scale(.988); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); font-size:14px; padding:13px; font-family:var(--body); }
.btn[disabled]{ opacity:.5; }

.q-text{ font-size:19px; margin-bottom:12px; }
.choices{ display:flex; flex-direction:column; gap:9px; }
.choice{
  display:block; width:100%; text-align:left; padding:17px 18px; border-radius:15px;
  border:1px solid var(--flat-line); background:var(--flat); color:var(--ink);
  font-family:"Space Mono",monospace; font-size:16.5px; cursor:pointer; direction:ltr;
  transition:border-color .16s ease, background .16s ease;
}
.choice.ar{ font-family:var(--body); direction:rtl; text-align:right; }
.choice.correct{ background:var(--glass); border-color:var(--ok); color:var(--ok); font-weight:700; box-shadow:var(--glass-shadow); }
.choice.wrong{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); text-decoration:line-through; }
.choice[disabled]{ cursor:default; }
.feedback{ margin-top:9px; font-size:15.5px; padding:9px 12px; border-radius:10px; display:none; }
.feedback.show{ display:block; }
.feedback.ok{ background:var(--ok-soft); color:var(--ok); }
.feedback.bad{ background:var(--bad-soft); color:var(--bad); }

.pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.pill{ padding:7px 14px; border-radius:999px; border:1px solid var(--flat-line); background:var(--flat); font-size:14.5px; cursor:pointer; color:var(--ink); }
.pill.active{ background:var(--glow); border-color:var(--glow); color:var(--void); font-weight:700; }

.flash{
  background:var(--flat); border:1px solid var(--flat-line); border-radius:16px; padding:20px; text-align:center;
  margin-bottom:12px; cursor:pointer; min-height:92px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  transition:background .16s ease, border-color .16s ease;
}
.flash .front{ font-size:22px; font-weight:700; color:var(--glow); }
.flash .hint{ font-size:13px; color:var(--ink-faint); }

.type-row{ display:flex; gap:8px; margin-top:9px; }
.type-input{ flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--flat-line); background:var(--flat); color:var(--ink); font-family:"Space Mono",monospace; font-size:16.5px; direction:ltr; }

.field-label{ font-size:13.5px; color:var(--ink-soft); margin-bottom:6px; display:block; }
.field-row{ display:flex; gap:8px; margin-bottom:14px; }
.field-input{ flex:1; padding:13px 14px; border-radius:12px; border:1px solid var(--flat-line); background:var(--flat); color:var(--ink); font-family:var(--body); font-size:16px; }
.field-input.en{ direction:ltr; text-align:left; }
.field-btn{ padding:0 18px; border-radius:12px; border:1px solid var(--btn-line); background:var(--btn-bg); color:var(--btn-ink); font-family:var(--display); font-weight:700; cursor:pointer; }

.speak-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:22px; border-radius:16px;
  background:var(--glow-tint); border:1px solid var(--glow); color:var(--glow); font-family:var(--display); font-size:19px; font-weight:700; cursor:pointer; margin-bottom:14px; }
.speak-btn:active{ transform:scale(.98); }
.replay{ text-align:center; font-size:13.5px; color:var(--ink-faint); margin-bottom:12px; cursor:pointer; }

.letters-row{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:12px 0; direction:ltr; }
.letter-box{
  width:50px; height:50px; border-radius:12px; border:1px solid var(--flat-line); background:var(--flat);
  display:flex; align-items:center; justify-content:center; font-family:"Space Mono",monospace; font-size:21px;
  cursor:pointer; user-select:none; transition:background .16s ease, border-color .16s ease;
}
.letter-box.picked{ background:var(--glow-tint); border-color:var(--glow); color:var(--glow); }
.letter-box.odd-correct{ background:var(--glass); border-color:var(--ok); color:var(--ok); box-shadow:var(--glass-shadow); }
.letter-box.odd-wrong{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }

.score-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; font-size:14.5px; color:var(--ink-soft); }
.score-bar b{ color:var(--glow); }

.done-banner{ text-align:center; padding:24px 18px; background:var(--glass); border:1px solid var(--glass-line); box-shadow:var(--glass-shadow); border-radius:20px; margin-bottom:14px; position:relative; }
.done-banner::before{ content:''; position:absolute; inset:0 14% auto; height:1px; background:linear-gradient(90deg,transparent,var(--edge),transparent); }
.done-banner h3{ color:var(--glow); font-family:var(--display); font-size:21px; margin-bottom:6px; }

.report-row{ display:flex; justify-content:space-between; align-items:center; background:var(--flat); border:1px solid var(--flat-line); border-radius:13px; padding:13px 15px; margin-bottom:9px; }
.report-row .rt{ font-size:15px; }
.report-row .rd{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
.report-row .rs{ font-family:"Space Mono",monospace; font-size:16px; color:var(--glow); font-weight:700; }
.total-card{ text-align:center; padding:20px; }
.total-card .big{ font-family:"Space Mono",monospace; font-size:34px; font-weight:700; color:var(--glow); }

.footer-credit{ text-align:center; font-size:13px; color:var(--ink-faint); margin-top:26px; line-height:1.8; }
.gate-wrap{ min-height:66vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:10px 6px; }
.gate-input{ font-size:32px; letter-spacing:16px; text-align:center; width:100%; max-width:220px; padding:16px 0 16px 16px;
  border-radius:16px; border:1px solid var(--flat-line); background:var(--flat); color:var(--ink); font-family:"Space Mono",monospace; }
.gate-error{ color:var(--bad); font-size:14px; min-height:18px; }
[hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="appbar">
  <div class="title-block" id="titleBlock"></div>
  <div class="right">
    <button class="theme-toggle" id="settingsBtn" onclick="openSettings()" aria-label="الإعدادات">⚙</button>
    <button class="theme-toggle" id="themeBtn" onclick="quickToggleTheme()" aria-label="تبديل المظهر"></button>
    <span class="dot" id="accentDot"></span>
  </div>
</div>
<div class="content" id="content"><div class="inner" id="inner"></div></div>
<div class="tabbar" id="tabbar"></div>

<script>
/* =========================================================================
   رفيق الإنجليزية — نسخة تجريبية موسّعة. كل الجمل والكلمات والنصوص هنا من
   تأليفنا بالكامل: مستوحاة من أفكار تدريسية عامة لا من نصوص أحد الحرفية.
   الأصوات تُنتَج آليًا من متصفح الطالب (لا ملفات صوت).
   ========================================================================= */

const LS_KEY = "eng_companion_v2";
function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveState(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
let STATE = loadState();
STATE.done = STATE.done || {};
STATE.scores = STATE.scores || {};
STATE.reports = STATE.reports || [];
STATE.lang = STATE.lang || "ar";

/* ------------------------------ Themes -------------------------------- */
const THEMES = ["dark","light","navy","amber"];
const THEME_ICON = {dark:"☾", light:"☀", navy:"🔷", amber:"🔶"};
function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); STATE.theme=t; saveState(STATE); updateThemeBtn(); }
function quickToggleTheme(){ const cur = STATE.theme||"dark"; applyTheme(cur==="light" ? "dark" : "light"); }
function updateThemeBtn(){ const b=document.getElementById("themeBtn"); if(b) b.textContent = (STATE.theme||"dark")==="light" ? "☾" : "☀"; }
document.documentElement.setAttribute("data-theme", STATE.theme||"dark");

/* ---------------------------- Language / i18n --------------------------- */
const STR = {
  ar:{
    appTitle:"رفيق الإنجليزية", appSub:"English StudyMate",
    tabHome:"الرئيسية", tabFoundation:"المسار التأسيسي", tabFree:"تدريب حر", tabReport:"تقريري",
    subLetters:"الحروف", subTenses:"الأزمنة", subTranslate:"الترجمة",
    home_hello:"مرحبًا 👋", home_sub:"رفيق الإنجليزية — تدرّب بالطريقة التي تناسبك.",
    home_name_label:"اسمك", home_name_ph:"اكتب اسمك هنا",
    home_stage_label:"مرحلتك الدراسية", stage_middle:"متوسط", stage_high:"ثانوي", stage_uni:"جامعي",
    home_code_label:"عندك كود مهمة من معلمك؟", home_code_ph:"مثال: GRAMMAR", enter_btn:"دخول",
    home_card1_title:"🧭 ابدأ من الصفر", home_card1_desc:"مسار موجّه: الحروف ← الأزمنة ← الترجمة، خطوة بخطوة.",
    home_card2_title:"🎯 درّبني على مهارة معيّنة", home_card2_desc:"اختر مباشرة: قواعد، قراءة، استماع، فونكس أو مفردات.",
    home_footer:"بالتعاون مع المعلم الفاضل الأستاذ حسام عبدالله في المنهجية التدريسية",
    settings_title:"⚙ الإعدادات", settings_lang_label:"لغة الواجهة", settings_theme_label:"الألوان",
    theme_dark:"الليلي", theme_light:"النهاري", theme_navy:"الكحلي المضيء", theme_amber:"الكهرماني",
    settings_credits_title:"الحقوق",
    back_word:"← رجوع",

function t(key){ const l = STATE.lang||"ar"; return (STR[l] && STR[l][key]!==undefined) ? STR[l][key] : STR.ar[key]; }
// سطر الحقوق ثابت بالإنجليزية دائمًا، بغض النظر عن لغة الواجهة المختارة.
const CREDITS_TEXT = "© 2026 All rights reserved — a collaboration between the esteemed teacher, Mr. Hossam Abdalla, and Arafat Alrajhi";
function applyLangDom(){
  const l = STATE.lang||"ar";
  document.documentElement.setAttribute("lang", l==="en"?"en":"ar");
  document.documentElement.setAttribute("dir", l==="en"?"ltr":"rtl");
  document.body.setAttribute("data-lang", l);
  const tb = document.getElementById("titleBlock");
  if(tb) tb.innerHTML = `<h1>${t("appTitle")}</h1><span class="brand-sub en">${t("appSub")}</span>`;
}
function toggleLang(){ STATE.lang = (STATE.lang==="en") ? "ar" : "en"; saveState(STATE); applyLangDom(); renderTabbar(); render(); }
function setLang(l){ if(STATE.lang===l) return; STATE.lang=l; saveState(STATE); applyLangDom(); renderTabbar(); render(); }
function openSettings(){ sub.prevTab = currentTab; currentTab = "settings"; setAccent(); render(); }
function closeSettings(){ switchTab(sub.prevTab || "home"); }

function nudge(msg){
  const existing = document.getElementById("nudgeToast");
  if(existing) existing.remove();
  const el = document.createElement("div");
  el.id = "nudgeToast"; el.className = "nudge-toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2000);
}
function speak(text){
  if(!("speechSynthesis" in window)) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* أكواد تفعيل الدخول — كل كود مربوط بدفعة/مجموعة، حتى تعرف من أي دفعة انضمّ كل طالب.
   إضافة دفعة جديدة = سطر واحد هنا فقط، بلا أي تعديل آخر. */
const ACTIVATION_CODES = [
  {code:"2026", label:"الدفعة العامة"},
  {code:"1001", label:"دفعة الأستاذ حسام"},
  {code:"1002", label:"الدفعة الصباحية"},
  {code:"1003", label:"الدفعة المسائية"},
  {code:"9999", label:"دفعة تجريبية"}
];

let currentTab = STATE.lastTab || "home";
let foundSub = STATE.foundSub || "letters";
let sub = {};

function isFoundUnlocked(id){
  if(id==="letters") return true;
  if(id==="tenses") return !!STATE.done.letters;
  if(id==="translate") return !!STATE.done.tenses;
  return true;
}
if(!isFoundUnlocked(foundSub)) foundSub = "letters";

function pushReport(module, title, score, total){
  STATE.reports.push({module, title, score, total, date:new Date().toLocaleDateString(STATE.lang==="en"?"en-GB":"ar-EG")});
  saveState(STATE);
}
function resetSkillState(id){
  sub.reported = false;
  if(id==="reading"){ sub.readIdx=0; sub.readQIdx=-1; sub.readCorrect=0; sub.readTotal=0; }
  if(id==="listening"){ sub.listenIdx=0; sub.listenCorrect=0; }
  if(id==="phonics"){ sub.phonIdx=0; sub.phonMode="cards"; sub.flashIdx=0; sub.phonCorrect=0; sub.phonTotal=0; }
  if(id==="grammar"){ sub.tensesView="lesson"; sub.lessonStep=0; sub.quizIdx=0; sub.quizCorrect=0; }
  if(id==="vocab"){ sub.trLevel=null; sub.trMode="vocab"; sub.flashIdx=0; sub.transIdx=0; sub.transCorrect=0; }
}
function applyCode(raw){
  const code = (raw||"").trim().toUpperCase();
  const c = CODES[code];
  if(!c){ nudge(t("unknown_code")); return; }
  currentTab = c.tab; STATE.lastTab = c.tab; saveState(STATE);
  if(c.tab==="free" && c.skill){ sub.freeSkill = c.skill; resetSkillState(c.skill); }
  setAccent(); renderTabbar(); render();
  nudge(t("code_unlocked"));
}

function setAccent(){
  let color, tint;
  if(currentTab==="foundation"){
    const f = FOUND_TABS().find(x=>x.id===foundSub);
    color = f.color; tint = f.tint;
  } else if(currentTab==="free"){
    color = "var(--c-free)"; tint = "var(--c-free-tint)";
  } else if(currentTab==="report"){
    color = "var(--c-report)"; tint = "var(--c-report-tint)";
  } else {
    color = "var(--c-home)"; tint = "var(--c-home-tint)";
  }
  document.body.style.setProperty("--glow", color);
  document.body.style.setProperty("--glow-tint", tint);
  document.body.style.setProperty("--btn-bg", `color-mix(in srgb, ${color} 18%, transparent)`);
  document.body.style.setProperty("--btn-line", `color-mix(in srgb, ${color} 34%, transparent)`);
  document.body.style.setProperty("--btn-ink", `color-mix(in srgb, ${color} 78%, white)`);
}
function renderTabbar(){
  document.getElementById("tabbar").innerHTML = TABS().map(tb=>{
    return `<button class="tab ${tb.id===currentTab?'active':''}" style="--tab-color:${tb.color}" onclick="switchTab('${tb.id}')">
      <span class="ic">${tb.icon}</span><span>${tb.label}</span>
    </button>`;
  }).join("");
}
function switchTab(id){
  currentTab = id; STATE.lastTab = id; saveState(STATE);
  setAccent(); renderTabbar(); render();
}
function switchFound(id){
  if(!isFoundUnlocked(id)){
    const prev = FOUND_TABS()[FOUND_TABS().findIndex(x=>x.id===id)-1];
    nudge(`${t("lock_prefix")}${prev.label}${t("lock_suffix")}`);
    return;
  }
  foundSub = id; STATE.foundSub = id; saveState(STATE);
  setAccent(); render();
}
function render(){
  const inner = document.getElementById("inner");
  if(!STATE.activated){ inner.innerHTML = renderGate(); wireGate(); return; }
  if(currentTab==="home") inner.innerHTML = renderHome();
  else if(currentTab==="foundation") inner.innerHTML = renderFoundSubbar() + renderFoundContent();
  else if(currentTab==="free") inner.innerHTML = renderFree();
  else if(currentTab==="report") inner.innerHTML = renderReportTab();
  else if(currentTab==="settings") inner.innerHTML = renderSettings();
  wireEvents();
}
function renderGate(){
  return `<div class="gate-wrap">
    <div style="font-size:44px;">🔐</div>
    <h2 style="font-family:var(--display);font-size:22px;font-weight:700;">${t("gate_title")}</h2>
    <p style="color:var(--ink-soft);font-size:15px;max-width:320px;">${t("gate_sub")}</p>
    <input class="gate-input en" id="gateInput" inputmode="numeric" maxlength="4" placeholder="${t("gate_ph")}">
    <div class="gate-error" id="gateError"></div>
    <button class="btn" id="gateBtn" style="max-width:220px;">${t("gate_btn")}</button>
  </div>`;
}
function wireGate(){
  const input = document.getElementById("gateInput");
  const btn = document.getElementById("gateBtn");
  const err = document.getElementById("gateError");
  if(!input) return;
  input.focus();
  const tryActivate = ()=>{
    const val = input.value.trim();
    const match = ACTIVATION_CODES.find(c=>c.code===val);
    if(match){
      STATE.activated = true; STATE.activationBatch = match.label; saveState(STATE);
      renderTabbar(); setAccent();
      const urlTask = new URLSearchParams(location.search).get("task");
      if(urlTask){ applyCode(urlTask); } else { render(); }
    } else {
      err.textContent = t("gate_error");
      input.value = ""; input.focus();
    }
  };
  btn.onclick = tryActivate;
  input.oninput = ()=>{ input.value = input.value.replace(/\D/g,"").slice(0,4); if(input.value.length===4) tryActivate(); };
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") tryActivate(); });
}

/* ------------------------------- Letters ------------------------------------ */
sub.lettersStep = STATE.lettersStep || 0;
function renderLetters(){
  const total = LETTER_SETS.length + ODD_ROWS.length;
  if(sub.lettersStep >= total){
    STATE.done.letters = {done:true}; saveState(STATE);
    return `<div class="hero"><h2>${t("letters_title")}</h2><p>${t("letters_sub")}</p></div>
      <div class="done-banner"><h3>${t("letters_done_title")}</h3><p>${t("letters_done_sub")}</p></div>
      <button class="btn" style="width:100%" onclick="sub.lettersStep=0; STATE.lettersStep=0; saveState(STATE); render();">${t("redo_btn")}</button>`;
  }
  const n = total;
  if(sub.lettersStep < LETTER_SETS.length){
    const set = LETTER_SETS[sub.lettersStep];
    const lower = [...set.map(x=>x.toLowerCase())].sort(()=>Math.random()-.5);
    return `<div class="hero"><h2>${t("letters_title")}</h2><p>${t("letters_exercise")} ${sub.lettersStep+1} ${t("of_word")} ${n}</p></div>
      <div class="card">
        <h3>${t("letters_instr_match")}</h3>
        <div class="letters-row" id="upperRow">${set.map(c=>`<div class="letter-box en" data-v="${c}">${c}</div>`).join("")}</div>
        <div class="letters-row" id="lowerRow">${lower.map(c=>`<div class="letter-box en" data-v="${c}">${c}</div>`).join("")}</div>
        <div class="feedback" id="fbLetters"></div>
      </div>`;
  } else {
    const idx = sub.lettersStep - LETTER_SETS.length;
    const item = ODD_ROWS[idx];
    return `<div class="hero"><h2>${t("letters_title")}</h2><p>${t("letters_exercise")} ${sub.lettersStep+1} ${t("of_word")} ${n}</p></div>
      <div class="card">
        <h3>${t("letters_instr_odd")}</h3>
        <div class="letters-row" id="oddRow">${item.row.map((c,i)=>`<div class="letter-box en" data-i="${i}">${c}</div>`).join("")}</div>
        <div class="feedback" id="fbOdd"></div>
      </div>`;
  }
}
function wireLetters(){
  const upperRow = document.getElementById("upperRow");
  if(upperRow){
    const set = LETTER_SETS[sub.lettersStep];
    let pickedUpper = null, matched = new Set();
    const upBoxes = [...document.querySelectorAll("#upperRow .letter-box")];
    const lowBoxes = [...document.querySelectorAll("#lowerRow .letter-box")];
    upBoxes.forEach(b=>b.onclick=()=>{
      if(matched.has(b.dataset.v)) return;
      upBoxes.forEach(x=>x.classList.remove("picked"));
      b.classList.add("picked"); pickedUpper = b;
    });
    lowBoxes.forEach(b=>b.onclick=()=>{
      if(!pickedUpper || matched.has(b.dataset.v.toUpperCase())) return;
      const fb = document.getElementById("fbLetters");
      if(b.dataset.v === pickedUpper.dataset.v.toLowerCase()){
        b.classList.add("odd-correct"); pickedUpper.classList.add("odd-correct");
        matched.add(pickedUpper.dataset.v);
        pickedUpper.onclick=null; b.onclick=null; pickedUpper=null;
        fb.className="feedback show ok"; fb.textContent=t("correct_fb");
        if(matched.size===set.length) setTimeout(()=>{ sub.lettersStep++; STATE.lettersStep=sub.lettersStep; saveState(STATE); render(); }, 500);
      } else {
        fb.className="feedback show bad"; fb.textContent=t("wrong_fb");
        pickedUpper.classList.remove("picked"); pickedUpper=null;
      }
    });
  }
  const oddRow = document.getElementById("oddRow");
  if(oddRow){
    const idx = sub.lettersStep - LETTER_SETS.length;
    const item = ODD_ROWS[idx];
    const boxes = [...oddRow.querySelectorAll(".letter-box")];
    boxes.forEach(b=>b.onclick=()=>{
      const i2 = +b.dataset.i;
      const fb = document.getElementById("fbOdd");
      boxes.forEach(x=>x.onclick=null);
      boxes[item.odd].classList.add("odd-correct");
      if(i2===item.odd){ fb.className="feedback show ok"; fb.textContent=t("odd_correct_fb"); }
      else { b.classList.add("odd-wrong"); fb.className="feedback show bad"; fb.textContent=t("odd_wrong_fb"); }
      setTimeout(()=>{ sub.lettersStep++; STATE.lettersStep=sub.lettersStep; saveState(STATE); render(); }, 900);
    });
  }
}

/* -------------------------------- Tenses ------------------------------------- */
sub.tensesView = sub.tensesView || "lesson";
sub.lessonStep = sub.lessonStep || 0;
sub.quizIdx = sub.quizIdx || 0; sub.quizCorrect = sub.quizCorrect || 0;
const TENSES_TOTAL_STEPS = TENSE_LESSONS.length + LINK_PRINCIPLE.length;
function renderTenses(){
  if(sub.tensesView==="lesson"){
    const step = sub.lessonStep;
    const dots = Array.from({length:TENSES_TOTAL_STEPS}, (_,i)=>
      `<span class="step-dot ${i===step?'on':i<step?'past':''}"></span>`).join("");
    if(step < TENSE_LESSONS.length){
      const lst = TENSE_LESSONS[step];
      return `<div class="hero"><h2>${t("grammar_title")}</h2><p>${t("step_word")} ${step+1} ${t("of_word")} ${TENSES_TOTAL_STEPS}</p></div>
        <div class="card">
          <h3><span class="en">${lst.en}</span> — ${lst.ar}</h3>
          <p>${lst.use}</p>
          ${lst.ex.map(e=>`<div class="eg"><span class="en">${e[0]}</span>${e[1]}</div>`).join("")}
        </div>
        <div class="step-dots">${dots}</div>
        <div class="step-nav">
          ${step>0?`<button class="btn ghost" onclick="sub.lessonStep--; render();">${t("prev_btn")}</button>`:""}
          <button class="btn" onclick="sub.lessonStep++; render();">${t("next_btn")}</button>
        </div>`;
    }
    const pIdx = step - TENSE_LESSONS.length;
    const isLastPrinciple = pIdx === LINK_PRINCIPLE.length - 1;
    return `<div class="hero"><h2>${t("grammar_title")}</h2><p>${t("step_word")} ${step+1} ${t("of_word")} ${TENSES_TOTAL_STEPS} ${t("link_step_suffix")}</p></div>
      <div class="card"><p style="font-size:19px;">${LINK_PRINCIPLE[pIdx]}</p></div>
      <div class="step-dots">${dots}</div>
      <div class="step-nav">
        <button class="btn ghost" onclick="sub.lessonStep--; render();">${t("prev_btn")}</button>
        ${isLastPrinciple

  }
  if(currentTab==="report") wireReportTab();
  if(currentTab==="settings") wireSettings();
}

/* --------------------------------- Boot ------------------------------------ */
applyLangDom();
updateThemeBtn();
if(STATE.activated){
  renderTabbar();
  setAccent();
  const urlTask = new URLSearchParams(location.search).get("task");
  if(urlTask){ applyCode(urlTask); } else { render(); }
} else {
  render();
}

/* --------------------------- Install & update banners --------------------------- */
function showActionBanner(text, btnLabel, onAction, dismissLabel){
  const old = document.getElementById("actionBanner"); if(old) old.remove();
  const el = document.createElement("div");
  el.id = "actionBanner"; el.className = "action-banner";
  el.innerHTML = `<span class="txt">${text}</span>
    <button class="btn" id="actionBannerBtn">${btnLabel}</button>
    ${dismissLabel ? `<button class="x" id="actionBannerX" aria-label="${dismissLabel}">×</button>` : ""}`;
  document.body.appendChild(el);
  document.getElementById("actionBannerBtn").onclick = onAction;
  const x = document.getElementById("actionBannerX");
  if(x) x.onclick = ()=> el.remove();
}

let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showActionBanner(t("install_title"), t("install_btn"), async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    const b = document.getElementById("actionBanner"); if(b) b.remove();
  }, t("install_dismiss"));
});
window.addEventListener("appinstalled", ()=>{
  const b = document.getElementById("actionBanner"); if(b) b.remove();
  deferredInstallPrompt = null;
});

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
